<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recipe Search</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/index_style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="vh-100 position-relative">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-opacity">

      <a class="navbar-brand" href="#">
        <img src="images/logo.png" class="logo" alt="logo">
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav ml-auto">

          <li class="nav-item active">
            <a class="nav-link" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#recipesSearch">
              Recipes
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Blog</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>

        </ul>

      </div>

    </nav>


    <!-- Header Content -->

    <div class="header-content">

      <h1>
        Never Miss a Recipe!
      </h1>

      <p>
        Search for your favorite recipes
      </p>

      <!-- Search -->

      <div class="search-box">

        <input id="searchInput" type="text" placeholder="Search recipes...">

        <button id="searchBtn" class="btn btn-mine">

          Search

        </button>

      </div>

    </div>

  </header>


  <!-- ================= RECIPES ================= -->

  <section id="recipesSearch">

    <div class="container py-5">

      <div class="section-title text-center">

        <h2>
          Recipe Categories
        </h2>

        <p>
          Choose one of the available products
        </p>

      </div>


      <!-- Product Filters -->
      <div class="filter-buttons">

        <button class="filter-btn" onclick="getAll()">All</button>

        <button class="filter-btn" onclick="getProduct('mango')">
          Mango
        </button>

        <button class="filter-btn" onclick="getProduct('melon')">
          Melon
        </button>

        <button class="filter-btn" onclick="getProduct('nectarine')">
          Nectarine
        </button>

        <button class="filter-btn" onclick="getProduct('orange')">
          Orange
        </button>

        <button class="filter-btn" onclick="getProduct('papaya')">
          Papaya
        </button>

      </div>
      <!-- Products -->

      <div class="row mt-5" id="rowData">

        <!-- JavaScript will display products here -->

      </div>

    </div>

  </section>


  <!-- ================= SCRIPTS ================= -->

  <script src="js/jquery-3.4.1.min.js"></script>

  <script src="js/bootstrap.min.js"></script>

  <script src="js/mine.js"></script>

</body>

</html>
